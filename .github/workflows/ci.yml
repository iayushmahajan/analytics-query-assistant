name: Verify analytics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_disposable_admin
          POSTGRES_DB: analytics_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d analytics_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci_disposable_admin
      POSTGRES_USER: postgres
      POSTGRES_DB: analytics_db
      APP_DB_PASSWORD: ci_disposable_app
      ANALYTICS_DB_PASSWORD: ci_disposable_reader
      TEST_DATABASE_URL: postgresql://analytics_app:ci_disposable_app@localhost:5432/analytics_db
      TEST_ANALYTICS_DATABASE_URL: postgresql://analytics_reader:ci_disposable_reader@localhost:5432/analytics_db
      TEST_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: sh database/init.sh
      - run: ruff check backend
      - run: python -m compileall -q backend/app
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci_disposable_admin
          APP_DB_PASSWORD: ci_disposable_app
          ANALYTICS_DB_PASSWORD: ci_disposable_reader
      - run: docker build -t analytics-backend backend
      - run: docker build -t analytics-frontend frontend
